<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Page Not Found | Sanjoy Kumar Roy</title>
<link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="styles.css">
<style>
  .not-found-wrap {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 80vh;
    text-align: center;
    padding: 40px 24px;
    margin: 0 auto;
    max-width: 600px;
  }
  .not-found-num {
    font-size: 80px;
    font-weight: 800;
    color: var(--teal);
    line-height: 1;
    margin: 0 0 16px;
  }
  .not-found-text {
    font-size: 18px;
    color: var(--muted);
    margin: 16px 0 28px;
    line-height: 1.6;
  }
</style>
</head>
<body>
<main class="not-found-wrap">
  <div class="not-found-num">404</div>
  <h1>Page Not Found<span class="accent">.</span></h1>
  <p class="not-found-text">The page you are looking for doesn't exist or may have been moved.</p>
  <div>
    <a class="button primary" href="/">Return to Homepage →</a>
  </div>
</main>
</body>
</html>
